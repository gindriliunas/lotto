name: Deploy

on:
  workflow_run:
    workflows: ["Security"]
    types: [completed]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out the commit that passed the scans
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Assume the role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::631026310596:role/gindriliunas
          aws-region: eu-west-2

      - name: Build, scan, and push
        id: image
        run: |
          set -euo pipefail
          registry=631026310596.dkr.ecr.eu-west-2.amazonaws.com
          tag="${IMAGE_SHA}"
          if [ -z "$tag" ]; then
            echo "The Security run did not provide a commit." >&2
            exit 1
          fi

          digest="$(aws ecr describe-images --repository-name scratch-card --image-ids "imageTag=${tag}" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)"
          if [ -z "$digest" ] || [ "$digest" = "None" ]; then
            aws ecr get-login-password --region eu-west-2 | docker login --username AWS --password-stdin "$registry"
            docker build -t scratch-card:scan .
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "${GITHUB_WORKSPACE}:/work" \
              -w /work \
              ghcr.io/aquasecurity/trivy:0.76.0 \
              image \
              --exit-code 1 \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --skip-version-check \
              --timeout 10m \
              scratch-card:scan
            docker tag scratch-card:scan "${registry}/scratch-card:${tag}"
            docker push "${registry}/scratch-card:${tag}"
            digest="$(aws ecr describe-images --repository-name scratch-card --image-ids "imageTag=${tag}" --query 'imageDetails[0].imageDigest' --output text)"
          fi

          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "${digest}"

      - name: Register the digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          image="631026310596.dkr.ecr.eu-west-2.amazonaws.com/scratch-card@${DIGEST}"
          aws ecs describe-task-definition --task-definition scratch-card --query taskDefinition > task-definition.json
          jq --arg image "$image" '
            .containerDefinitions |= map(if .name == "scratch-card" then .image = $image else . end)
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' task-definition.json > register.json
          arn="$(aws ecs register-task-definition --cli-input-json file://register.json --query taskDefinition.taskDefinitionArn --output text)"
          aws ecs update-service --cluster scratch-card --service scratch-card --task-definition "$arn" >/dev/null
          echo "$arn"
