name: Deploy

on:
  workflow_dispatch:

jobs:
  whoami:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Assume the role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::631026310596:role/gindriliunas
          aws-region: eu-west-2

      - name: Show the assumed identity
        run: aws sts get-caller-identity